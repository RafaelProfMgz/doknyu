
app-id: io.github.rafaelprofmgz.Doknyu
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: doknyu

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=/run/docker.sock
  - --filesystem=xdg-run/docker.sock

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/doknyu/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: doknyu
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked --bin doknyu
      - install -Dm755 target/release/doknyu -t /app/bin
      - install -Dm644 assets/io.github.rafaelprofmgz.Doknyu.desktop -t /app/share/applications
      - install -Dm644 assets/io.github.rafaelprofmgz.Doknyu.metainfo.xml -t /app/share/metainfo
      - install -Dm644 assets/icons/io.github.rafaelprofmgz.Doknyu.svg -t /app/share/icons/hicolor/scalable/apps
      - |
        for n in 16 24 32 48 64 128 256 512; do
          install -Dm644 assets/icons/hicolor/${n}x${n}/apps/io.github.rafaelprofmgz.Doknyu.png \
            -t /app/share/icons/hicolor/${n}x${n}/apps
        done
      - install -Dm644 LICENSE-MIT LICENSE-APACHE assets/fonts/LICENSES.md -t /app/share/licenses/io.github.rafaelprofmgz.Doknyu
    sources:
      # BEGIN-SOURCE
      # Gerado por packaging/flatpak/pin-release.sh; não edite à mão.
      - type: git
        url: https://github.com/RafaelProfMgz/doknyu.git
        tag: v0.2.0
        commit: 25f165a3d332f6aadc0a1707a1854c5a03964975
      # END-SOURCE
      - cargo-sources.json
