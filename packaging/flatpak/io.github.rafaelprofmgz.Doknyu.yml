# Rascunho do spike 7.1 (ver docs/decisions/0002-flatpak.md). Será reescrito na Tarefa 7.2
# (fonte `type: archive` da tag, sem `type: dir`, sem o binário de sondagem).
app-id: io.github.rafaelprofmgz.Doknyu
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: doknyu

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Docker rootful: /var/run é symlink para /run, então /run/docker.sock cobre os dois caminhos.
  - --filesystem=/run/docker.sock
  # Docker rootless: $XDG_RUNTIME_DIR/docker.sock (o Flatpak só aceita a forma xdg-run/).
  - --filesystem=xdg-run/docker.sock

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/doknyu/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: doknyu
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked --bin doknyu
      - install -Dm755 target/release/doknyu -t /app/bin
      - install -Dm644 assets/io.github.rafaelprofmgz.Doknyu.desktop -t /app/share/applications
      - install -Dm644 assets/io.github.rafaelprofmgz.Doknyu.metainfo.xml -t /app/share/metainfo
      - install -Dm644 assets/icons/io.github.rafaelprofmgz.Doknyu.svg -t /app/share/icons/hicolor/scalable/apps
      - |
        for n in 16 24 32 48 64 128 256 512; do
          install -Dm644 assets/icons/hicolor/${n}x${n}/apps/io.github.rafaelprofmgz.Doknyu.png \
            -t /app/share/icons/hicolor/${n}x${n}/apps
        done
      - install -Dm644 LICENSE-MIT LICENSE-APACHE assets/fonts/LICENSES.md -t /app/share/licenses/io.github.rafaelprofmgz.Doknyu
    sources:
      # SPIKE: diretório local. Na 7.2 vira `type: archive` com url e sha256 da tag.
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - docs
      - cargo-sources.json
