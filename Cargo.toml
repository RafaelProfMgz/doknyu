[package]
name = "doknyu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Gerenciador desktop de containers Docker para Linux"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
# Roda a UI com FakeClient, sem Docker.
fake = []

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "advanced"] }
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = "4"
sys-locale = "0.3"
open = "5"
iced_term = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
