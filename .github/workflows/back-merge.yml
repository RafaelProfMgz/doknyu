name: Back-merge main → develop

# Cada promoção develop → main cria um commit de merge que só existe na main, e o GitHub passa a
# avisar que a develop está atrás. Este workflow devolve a main para a develop por PR (a develop
# só aceita PR) e faz o merge. O PR não tem mudança de conteúdo. Fluxo completo em CLAUDE.md.
# Requer "Allow GitHub Actions to create and approve pull requests" nas configurações do repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Abre e mergeia o PR main → develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "A develop já contém a main; nada a fazer."
            exit 0
          fi
          pr="$(gh pr list --base develop --head main --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --base develop --head main \
              --title "chore: back-merge main into develop" \
              --body "Aberto pelo workflow \`back-merge.yml\` depois de uma promoção para a \`main\`. Traz para a \`develop\` o commit de merge da promoção; sem mudança de conteúdo." \
              --label skip-changelog
            pr="$(gh pr list --base develop --head main --state open --json number -q '.[0].number')"
          fi
          # O GitHub calcula a mergeabilidade de forma assíncrona logo depois de criar o PR.
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$pr" --merge; then exit 0; fi
            sleep 10
          done
          echo "::error::Não foi possível mergear o PR #$pr; faça o merge manualmente."
          exit 1
